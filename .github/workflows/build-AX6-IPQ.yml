name: Build OpenWRT for AX6-IPQ

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/LiBwrt-op/openwrt-6.x.git
  CONFIG_FILE: AX6-IPQ/.config-ipq
  DIY_SH: AX6-IPQ/diy.sh
  FILES: AX6-IPQ/files
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Clean disk space (Native & Safe)
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune -a -f || true
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo rm -rf /var/lib/apt/lists/*
        df -hT

    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update -y
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
        bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
        git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
        libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
        mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
        python3-docutils qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
        unzip vim wget xmlto xxd zlib1g-dev libfuse-dev dwarves
        sudo timedatectl set-timezone "$TZ"
        sudo chown -R $USER:$GROUPS $GITHUB_WORKSPACE

    - name: Clone source code
      working-directory: ./
      run: |
        git clone --depth 1 $REPO_URL openwrt

    - name: cache wrt build
      uses: stupidloud/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: AX6-IPQ-build
        prefix: ${{ github.workspace }}/openwrt

    - name: Run DIY script
      run: |
        [ -e $FILES ] && cp -r $FILES openwrt/files
        chmod +x $DIY_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_SH

    - name: Update and Install feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        
        # 🚨 1. 物理清场：删除 feeds 目录下自带的所有 dae/daed，全网只留我们自己克隆的预编译版
        rm -rf feeds/packages/net/dae feeds/packages/net/daed
        rm -rf feeds/luci/applications/luci-app-dae feeds/luci/applications/luci-app-daed
        rm -rf feeds/small/dae feeds/small/daed feeds/small/luci-app-daed feeds/small/luci-app-daede
        
        # 🚨 2. 解除 package/luci-app-daed 下的死板依赖与 BTF/bpf-headers 绑定
        find package/luci-app-daed/ -type f -name "Makefile" | xargs sed -i -E 's/\+kmod-bpf //g; s/\+kmod-sched-bpf //g; s/\+kmod-inet-diag //g; s/\+kmod-tun //g' || true
        
        # 彻底干掉 bpf-headers 和 BTF 相关字眼，防止触发内核级 eBPF 源码编译崩溃
        find package/luci-app-daed/ -type f -name "Makefile" | xargs sed -i -E 's/\+[A-Za-z0-9_]*VMLINUX_BTF:bpf-headers//g' || true
        find package/luci-app-daed/ -type f -name "Makefile" | xargs sed -i -E 's/\+bpf-headers//g' || true
        find package/luci-app-daed/ -type f -name "Makefile" | xargs sed -i -E 's/@[A-Za-z0-9_]*VMLINUX_BTF://g' || true
        find package/luci-app-daed/ -type f -name "Makefile" | xargs sed -i -E 's/\+DAED_USE_VMLINUX_BTF://g' || true
        
        # 3. 清除 feeds 架构限制
        find feeds/ -type f -name "Makefile" 2>/dev/null | xargs sed -i -E 's/[+@]*[A-Za-z0-9_]*vmlinux-btf//g' 2>/dev/null || true
        find feeds/ -type f -name "Makefile" 2>/dev/null | xargs sed -i 's/@!LINUX_6_6//g' 2>/dev/null || true
        
        ./scripts/feeds install -f -a

    - name: Load custom config & defconfig
      run: |
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        cd openwrt

        # Nikki 与 Mihomo
        echo "CONFIG_PACKAGE_luci-app-nikki=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-nikki-zh-cn=y" >> .config
        echo "CONFIG_PACKAGE_nikki=y" >> .config
        echo "CONFIG_PACKAGE_mihomo=y" >> .config

        # daed 与核心 (无依赖阻拦版)
        echo "CONFIG_PACKAGE_luci-app-daed=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-daed-zh-cn=y" >> .config
        echo "CONFIG_PACKAGE_daed=y" >> .config
        echo "CONFIG_PACKAGE_dae=y" >> .config
        
        make defconfig

    - name: Download package
      working-directory: ./openwrt
      run: |
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      run: |
        chmod -R 755 openwrt
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s

    - name: Upload all outputs to Actions Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AX6-OpenWRT-Stock-AllFiles
        path: openwrt/bin/targets/qualcommax/ipq807x/
        retention-days: 90
