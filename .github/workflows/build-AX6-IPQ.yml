name: Build OpenWRT for AX6-IPQ

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/LiBwrt-op/openwrt-6.x.git
  CONFIG_FILE: AX6-IPQ/.config-ipq
  DIY_SH: AX6-IPQ/diy.sh
  FILES: AX6-IPQ/files
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Clean disk space (Native & Safe)
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune -a -f || true
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo rm -rf /var/lib/apt/lists/*
        df -hT

    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update -y
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
        bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
        git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
        libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
        mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
        python3-docutils qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
        unzip vim wget xmlto xxd zlib1g-dev libfuse-dev
        sudo timedatectl set-timezone "$TZ"
        sudo chown -R $USER:$GROUPS $GITHUB_WORKSPACE

    - name: Clone source code
      working-directory: ./
      run: |
        git clone --depth 1 $REPO_URL openwrt

    - name: cache wrt build
      uses: stupidloud/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: AX6-IPQ-build
        prefix: ${{ github.workspace }}/openwrt

    - name: Run DIY script
      run: |
        [ -e $FILES ] && cp -r $FILES openwrt/files
        chmod +x $DIY_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_SH

    - name: Update and Install feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -f -a

    - name: Load custom config & defconfig
      run: |
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        cd openwrt
        
        # 保留 eBPF 基础支持 (为后期手动安装 daed 打底)
        echo "CONFIG_BPF=y" >> .config
        echo "CONFIG_BPF_SYSCALL=y" >> .config
        echo "CONFIG_PACKAGE_kmod-bpf=y" >> .config
        echo "CONFIG_PACKAGE_kmod-sched-bpf=y" >> .config
        echo "CONFIG_PACKAGE_kmod-tun=y" >> .config
        echo "CONFIG_PACKAGE_kmod-inet-diag=y" >> .config

        # 剔除 Nikki、Mihomo、daed、dae
        sed -i '/nikki/d' .config
        sed -i '/mihomo/d' .config
        sed -i '/daed/d' .config
        sed -i '/dae/d' .config

        # 加入 HomeProxy
        echo "CONFIG_PACKAGE_luci-app-homeproxy=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y" >> .config

        # 加入 微信推送 (serverchan / pushbot)
        echo "CONFIG_PACKAGE_luci-app-serverchan=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-serverchan-zh-cn=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-pushbot=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-pushbot-zh-cn=y" >> .config

        # 加入 OpenClash
        echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config
        echo "CONFIG_PACKAGE_coreutils-nohup=y" >> .config

        # 加入 终端 (ttyd)
        echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y" >> .config
        
        make defconfig

    - name: Download package
      working-directory: ./openwrt
      run: |
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      run: |
        chmod -R 755 openwrt
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s

    - name: Upload all outputs to Actions Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AX6-OpenWRT-Stock-AllFiles
        path: openwrt/bin/targets/qualcommax/ipq807x/
        retention-days: 90
