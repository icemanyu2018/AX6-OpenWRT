name: Build OpenWRT for AX6-IPQ

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/LiBwrt-op/openwrt-6.x.git
  CONFIG_FILE: AX6-IPQ/.config-ipq
  DIY_SH: AX6-IPQ/diy.sh
  FILES: AX6-IPQ/files
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Clean disk space (Native & Safe)
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune -a -f || true
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo rm -rf /var/lib/apt/lists/*
        df -hT

    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update -y
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
        bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
        git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
        libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
        mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
        python3-docutils qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
        unzip vim wget xmlto xxd zlib1g-dev libfuse-dev dwarves
        sudo timedatectl set-timezone "$TZ"
        sudo chown -R $USER:$GROUPS $GITHUB_WORKSPACE

    - name: Clone source code
      working-directory: ./
      run: |
        git clone --depth 1 $REPO_URL openwrt

    - name: cache wrt build
      uses: stupidloud/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: AX6-IPQ-build
        prefix: ${{ github.workspace }}/openwrt

    - name: Run DIY script
      run: |
        [ -e $FILES ] && cp -r $FILES openwrt/files
        chmod +x $DIY_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_SH

    - name: Update and Install feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        # 清除 feeds 目录下所有干扰限制
        find feeds/ -type f -name "Makefile" 2>/dev/null | xargs sed -i -E 's/[+@]*[A-Za-z0-9_]*vmlinux-btf//g' 2>/dev/null || true
        find feeds/ -type f -name "Makefile" 2>/dev/null | xargs sed -i 's/@!LINUX_6_6//g' 2>/dev/null || true
        ./scripts/feeds install -f -a

    - name: Load custom config & defconfig
      run: |
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        cd openwrt
        
        # 1. 仅保留基础网络 BPF 模块 (彻底移除导致 bpf-headers 报错的底层 BTF 编译项)
        echo "CONFIG_BPF=y" >> .config
        echo "CONFIG_BPF_SYSCALL=y" >> .config
        echo "CONFIG_PACKAGE_kmod-bpf=y" >> .config
        echo "CONFIG_PACKAGE_kmod-sched-bpf=y" >> .config
        echo "CONFIG_PACKAGE_kmod-tun=y" >> .config
        echo "CONFIG_PACKAGE_kmod-inet-diag=y" >> .config

        # 2. Nikki 与 Mihomo 核心
        echo "CONFIG_PACKAGE_luci-app-nikki=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-nikki-zh-cn=y" >> .config
        echo "CONFIG_PACKAGE_nikki=y" >> .config
        echo "CONFIG_PACKAGE_mihomo=y" >> .config

        # 3. QiuSimons 预编译版 daed
        echo "CONFIG_PACKAGE_luci-app-daed=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-daed-zh-cn=y" >> .config
        echo "CONFIG_PACKAGE_daed=y" >> .config
        
        echo "========== 🛠️ 诊断开始：检查 daed 依赖链 =========="
        echo "1. 扫描所有 dae/daed 源码包，提取底层硬性依赖："
        find feeds/ package/ -type f -name "Makefile" | grep -E "daed/Makefile|dae/Makefile|luci-app-daed" | while read -r file; do
            echo -e "\n--- 解析文件：$file ---"
            grep -E "^DEPENDS" "$file" || echo "无 DEPENDS 声明"
            grep -E "ONLY_FOR_ARCHS" "$file" || echo "无架构锁"
        done
        echo -e "\n================================================="

        make defconfig
        
        echo "========== 🔍 诊断结果：defconfig 裁决报告 =========="
        echo "1. 检查 daed 的存活情况："
        grep -i "daed" .config || echo "⚠️ 警告：daed 全家桶已被系统静默剔除！"
        
        echo -e "\n2. 检查 eBPF 内核底座存活情况 (这是 daed 活着的前提)："
        grep -E "CONFIG_BPF|kmod-bpf" .config || echo "⚠️ 警告：kmod-bpf 底层模块被剔除了！"
        echo "==================================================="

    - name: Download package
      working-directory: ./openwrt
      run: |
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      run: |
        chmod -R 755 openwrt
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s

    - name: Upload all outputs to Actions Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AX6-OpenWRT-Stock-AllFiles
        path: openwrt/bin/targets/qualcommax/ipq807x/
        retention-days: 90
